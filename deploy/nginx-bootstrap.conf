# Temporary HTTP-only site for issuing the FIRST TLS certificate.
# Do not enable this alongside nginx.conf for the same host.
server {
    listen 80;
    server_name api.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503;
    }
}
