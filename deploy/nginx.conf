# Backend TLS proxy. See README.md for certificate bootstrap and installation.
# Install as /etc/nginx/sites-available/arb-api.
#
# Trong .env: HTTP_BIND_HOST=127.0.0.1 va WS_BIND_HOST=127.0.0.1.
# Chỉ mở firewall cổng 80 + 443.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream arb_rest     { server 127.0.0.1:3000; keepalive 16; }
upstream arb_admin_ws { server 127.0.0.1:3003; }
upstream arb_cons_ws  { server 127.0.0.1:3002; }
upstream arb_task_ws  { server 127.0.0.1:3001; }

server {
    listen 80;
    server_name api.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/arb-ops/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arb-ops/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    # ---------- REST
    location / {
        client_max_body_size 1m;
        proxy_pass http://arb_rest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket: phải có Upgrade/Connection, và timeout đọc dài
    # (Nginx mặc định cắt kết nối im lặng sau 60s; admin ping mỗi 30s, consumer/node có heartbeat).
    location = /admin-ws {
        proxy_pass http://arb_admin_ws;
        include /etc/nginx/snippets/arb-ws.conf;
    }

    location = /consumer-ws {
        proxy_pass http://arb_cons_ws;
        include /etc/nginx/snippets/arb-ws.conf;
    }

    location = /task-ws {
        # (Tùy chọn) chỉ cho IP của các node task-runner:
        # allow 203.0.113.10;
        # allow 203.0.113.11;
        # deny all;
        proxy_pass http://arb_task_ws;
        include /etc/nginx/snippets/arb-ws.conf;
    }
}
