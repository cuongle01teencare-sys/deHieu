[project]
name = "dehieu"
version = "0.3.0"
description = "Server-side score polling platform + CLI client"
readme = "README.md"
requires-python = "==3.12.*"

# Không có runtime deps mặc định — chọn group theo môi trường:
#   uv sync --group client    (máy dev, chạy REPL)
#   uv sync --group server    (Docker image, chạy poller/api)
dependencies = [
    "asyncpg>=0.31.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=13.0",
]

[dependency-groups]
client = [
    "rich>=13.7",
    "prompt-toolkit>=3.0.53",
    "httpx[http2]>=0.28",
    "pyyaml>=6.0",
]

server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx[http2]>=0.28",
    "curl-cffi>=0.7.0",              # mimic Chrome TLS để bypass CF bot detection
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-json-logger>=2.0",
    "websockets>=13",
]

dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
default-groups = ["client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "client"]
