worker_processes auto;
events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend { server api:8080; }

    server {
        listen 9443 ssl;
        http2 on;

        ssl_protocols            TLSv1.3;
        # TLS 1.3 ciphersuites phải set qua ssl_conf_command trên OpenSSL 3.x
        # (ssl_ciphers cũ chỉ nhận cipher TLS ≤ 1.2). Để trống thì nginx dùng
        # 3 cipher mặc định của TLS 1.3 — cả 3 đều đủ mạnh, an toàn để bỏ qua.
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
        ssl_prefer_server_ciphers off;

        ssl_certificate         /etc/nginx/certs/server.crt;
        ssl_certificate_key     /etc/nginx/certs/server.key;
        ssl_client_certificate  /etc/nginx/certs/ca.crt;
        ssl_verify_client       on;
        ssl_verify_depth        2;

        # forward CN của client cert xuống FastAPI để có audit
        proxy_set_header X-Client-CN $ssl_client_s_dn;

        location / {
            proxy_pass          http://api_backend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_set_header    Host $host;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
