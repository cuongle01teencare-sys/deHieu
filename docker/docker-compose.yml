name: dehieu

# deHieu server stack
#
# Chỉ nginx-mtls expose port ra host (9443). Mọi service khác chỉ nói chuyện
# qua internal network. Chrome giữ lại nhưng disabled by default —
# `docker compose --profile browser up` mới bật.

networks:
  backend:
    driver: bridge

volumes:
  pgdata:

services:
  timescaledb:
    # Image `-ha` (High Availability) — chính thức của Timescale, bao gồm sẵn:
    # timescaledb, timescaledb_toolkit, pg_cron, pg_stat_statements, postgis, ...
    # Base Debian, PGDATA mặc định /home/postgres/pgdata/data — override về
    # /var/lib/postgresql/data để dùng chung volume `pgdata` cũ (không migrate).
    image: timescale/timescaledb-ha:pg16
    env_file:
      - path: ../server.env
        required: true
        format: raw
    environment:
      POSTGRES_USER: dehieu
      POSTGRES_DB: dehieu
      PGDATA: /var/lib/postgresql/data
    # -c args truyền cho postmaster:
    #   shared_preload_libraries — bắt buộc để pg_cron activate
    #   cron.database_name       — pg_cron chỉ lưu job/log trong DB này
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb,pg_cron"
      - "-c"
      - "cron.database_name=dehieu"
    ports:
      - "127.0.0.1:5432:5432"   # bind localhost only để DBeaver connect
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dehieu"]
      interval: 5s
      retries: 10

  poller:
    build:
      context: ..
      dockerfile: docker/services/poller/Dockerfile
    env_file:
      - path: ../server.env
        required: true
        format: raw          # KHÔNG interpolate $ trong values (cookie chứa $)
    volumes:
      - ../logs:/app/logs    # errlog dump ra host: <repo>/logs/errors/YYYY-MM-DD/
    depends_on:
      timescaledb: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped


  polymarket-poller:
    # Cùng image với poller (sptpub) — chỉ đổi CMD. Reuse deps trong 1 build.
    build:
      context: ..
      dockerfile: docker/services/poller/Dockerfile
    env_file:
      - path: ../server.env
        required: true
        format: raw
    volumes:
      - ../logs:/app/logs
    depends_on:
      timescaledb: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped
    command: ["python", "-m", "server.poller.polymarket"]

  polymarket-ws-ingestor:
    build:
      context: ..
      dockerfile: docker/services/poller/Dockerfile
    env_file:
      - path: ../server.env
        required: true
        format: raw
    volumes:
      - ../logs:/app/logs
    depends_on:
      timescaledb: { condition: service_healthy }
      polymarket-poller: { condition: service_started }
    networks: [backend]
    restart: unless-stopped
    command: ["python", "-m", "server.poller.polymarket.ws"]

  arb-detector:
    build:
      context: ..
      dockerfile: docker/services/poller/Dockerfile
    env_file:
      - path: ../server.env
        required: true
        format: raw
    volumes:
      - ../logs:/app/logs
    depends_on:
      timescaledb: { condition: service_healthy }
      polymarket-poller: { condition: service_started }
      polymarket-ws-ingestor: { condition: service_started }
    networks: [backend]
    restart: unless-stopped
    command: ["python", "-m", "server.arb"]

  api:
    build:
      context: ..
      dockerfile: docker/services/api/Dockerfile
    env_file:
      - path: ../server.env
        required: true
        format: raw
    volumes:
      - ../logs:/app/logs
    depends_on:
      timescaledb: { condition: service_healthy }
    networks: [backend]
    expose: ["8080"]
    restart: unless-stopped

  nginx-mtls:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports:
      - "9443:9443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [backend]
    restart: unless-stopped

  # ---------- optional: Chrome cho token-refresh flow sau này ----------
  chrome:
    image: browserless/chromium:latest
    profiles: ["browser"]
    expose: ["9222"]
    command: >
      chromium --headless=new --no-sandbox --disable-gpu
      --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222
      --remote-allow-origins=*
    networks: [backend]
    restart: unless-stopped
